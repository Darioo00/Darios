<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bottone dell'amooooouuuuuur</title>
    
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            margin: 0;
            height: 100vh; /* Alto esattamente quanto lo schermo */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Niente barre di scorrimento, mai! */
        }

        h1 {
            margin-bottom: 40px;
            padding: 0 20px;
            color: #333;
        }

        /* Contenitore iniziale per tenerli vicini e centrati */
        .container-bottoni {
            display: flex;
            gap: 20px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: left 0.2s ease, top 0.2s ease; /* Animazione fluida */
        }

        #bottoneVero {
            background-color: #28a745;
            color: white;
            z-index: 10;
        }

        #bottoneDispettoso {
            background-color: #dc3545;
            color: white;
            z-index: 20;
        }
    </style>
</head>
<body>

    <h1>Lo sai che sei il mio amour bello bellissimo? EH!!</h1>
    
    <div class="container-bottoni">
        <button id="bottoneVero">SI</button>
        <button id="bottoneDispettoso">NO</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <script>
        const noBtn = document.getElementById('bottoneDispettoso');
        const siBtn = document.getElementById('bottoneVero');

        // --- LA MAGIA DEL BOTTONE CHE SCAPPA (DENTRO LO SCHERMO) ---
        noBtn.addEventListener('mouseover', () => {
            // Lo svincoliamo dal contenitore e lo leghiamo allo schermo visibile
            noBtn.style.position = 'fixed';

            // Margine di sicurezza per non farlo sbattere contro i bordi (es. 20 pixel)
            const margine = 20;

            // Calcoliamo lo spazio massimo disponibile sottraendo la grandezza del bottone e il margine
            const maxX = window.innerWidth - noBtn.offsetWidth - margine;
            const maxY = window.innerHeight - noBtn.offsetHeight - margine;

            // Generiamo coordinate sicure tra il margine e il limite massimo
            const randomX = Math.max(margine, Math.floor(Math.random() * maxX));
            const randomY = Math.max(margine, Math.floor(Math.random() * maxY));

            // Applichiamo le coordinate calcolate
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        });

        // --- L'AMORE TRIONFA (CUORI) ---
        siBtn.addEventListener('click', () => {
            // Coriandoli Normali
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });

            // Cuori Grandi
            const scalar = 3;
            const cuore = confetti.shapeFromText({ text: '❤️', scalar });

            confetti({
                shapes: [cuore],
                particleCount: 50,
                spread: 120,
                origin: { y: 0.7 },
                scalar: scalar
            });
        });

        // Se lo beccano per sbaglio
        noBtn.addEventListener('click', () => {
            alert("Hai barato! Ma sei comunque il mio amour! ❤️");
        });
    </script>
</body>
</html>
