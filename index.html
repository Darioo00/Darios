<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bottone dell'amooooouuuuuur</title>
    
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Centra tutto verticalmente nel browser */
            overflow: hidden; 
        }

        h1 {
            margin-bottom: 30px;
            color: #333;
        }

        /* Contenitore per tenere i bottoni vicini all'inizio */
        .container-bottoni {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 50px;
            position: relative;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        #bottoneVero {
            background-color: #28a745;
            color: white;
            z-index: 10;
        }

        #bottoneDispettoso {
            background-color: #dc3545;
            color: white;
            /* Inizialmente segue il flusso normale, poi diventerà absolute via JS */
            position: relative; 
            transition: top 0.2s, left 0.2s;
        }
    </style>
</head>
<body>

    <h1>Lo sai che sei il mio amour bello bellissimo? EH!!</h1>
    
    <div class="container-bottoni">
        <button id="bottoneVero">SI</button>
        <button id="bottoneDispettoso">NO</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <script>
        const noBtn = document.getElementById('bottoneDispettoso');
        const siBtn = document.getElementById('bottoneVero');

        // --- LOGICA DEL BOTTONE CHE SCAPPA ---
        noBtn.addEventListener('mouseover', function() {
            // Al primo passaggio del mouse, lo rendiamo "absolute" così può muoversi ovunque
            if (noBtn.style.position !== 'absolute') {
                noBtn.style.position = 'absolute';
            }

            // Calcolo posizioni casuali
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);

            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        });

        // --- LOGICA DEI CUORI (CORRETTA) ---
        siBtn.addEventListener('click', () => {
            // Coriandoli colorati
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });

            // Esplosione di CUORI
            const scalar = 3;
            const cuore = confetti.shapeFromText({ text: '❤️', scalar });

            confetti({
                shapes: [cuore],
                particleCount: 50,
                spread: 120,
                origin: { y: 0.7 },
                scalar: scalar
            });
        });

        // Se riescono a cliccare il NO (da tastiera o rapidità estrema)
        noBtn.addEventListener('click', () => {
            alert("Ninja! Ma tanto so che volevi premere SI! ❤️");
        });
    </script>

</body>
</html>
