<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bottone dell'amooooouuuuuur</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f9;
            overflow: hidden; 
        }
        
        #bottoneDispettoso {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            position: absolute;
            left: 50%;
            top: 50%;
            transition: top 0.15s, left 0.15s; 
        }

        #bottoneVero {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 20px;
        }
    </style>
</head>
<body>

    <h1>Lo sai che sei il mio amour bello bellissimo? EH!!</h1>
    
    <button id="bottoneVero">SI</button>
    <button id="bottoneDispettoso">NO</button>

    <script>
        const bottone = document.getElementById('bottoneDispettoso');
        bottone.addEventListener('mouseover', function() {
            const larghezzaSchermo = window.innerWidth - 150;
            const altezzaSchermo = window.innerHeight - 50;
            const nuovaPosizioneX = Math.floor(Math.random() * larghezzaSchermo);
            const nuovaPosizioneY = Math.floor(Math.random() * altezzaSchermo);
            bottone.style.left = nuovaPosizioneX + 'px';
            bottone.style.top = nuovaPosizioneY + 'px';
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <script>
const bottone2 = document.getElementById('bottoneVero');

bottone2.addEventListener('click', () => {
    
    // 1. Esplosione di coriandoli normali
    confetti({
        particleCount: 70,
        spread: 70,
        origin: { y: 0.6 }
    });

    // 2. Esplosione di CUORI usando le emoji (Metodo garantito)
    // Creiamo la forma partendo dal testo
    const scali = 3;
    const formaCuore = confetti.shapeFromText({ text: '❤️', scalar: scali });

    confetti({
        shapes: [formaCuore],
        particleCount: 40,
        spread: 100,
        origin: { y: 0.7 },
        scalar: scali
    });
});
</script>
</body>
</html>
