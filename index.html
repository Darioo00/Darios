<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bottone dell'amooooouuuuuur</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f9;
            overflow: hidden; 
        }
        
        #bottoneDispettoso {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            position: absolute;
            left: 50%;
            top: 50%;
            transition: top 0.15s, left 0.15s; 
        }

        #bottoneVero {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 20px;
        }
    </style>
</head>
<body>

    <h1>Lo sai che sei il mio amour bello bellissimo? EH!!</h1>
    
    <button id="bottoneVero">SI</button>
    <button id="bottoneDispettoso">NO</button>

    <script>
        const bottone = document.getElementById('bottoneDispettoso');
        bottone.addEventListener('mouseover', function() {
            const larghezzaSchermo = window.innerWidth - 150;
            const altezzaSchermo = window.innerHeight - 50;
            const nuovaPosizioneX = Math.floor(Math.random() * larghezzaSchermo);
            const nuovaPosizioneY = Math.floor(Math.random() * altezzaSchermo);
            bottone.style.left = nuovaPosizioneX + 'px';
            bottone.style.top = nuovaPosizioneY + 'px';
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <script>
        const bottone2 = document.getElementById('bottoneVero');

        bottone2.addEventListener('click', () => {
            // Effetto coriandoli base
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#ff0000', '#fe019a', '#ffcccb']
            });

            // Effetto CUORI (Funziona solo con versione 1.6.0 o superiore)
            const scalar = 3;
            const cuore = confetti.shapeFromPath({ 
                path: 'M 10 30 C 10 30 0 20 0 10 C 0 0 10 0 10 0 C 10 0 20 0 20 10 C 20 20 10 30 10 30',
                matrix: [0.03, 0, 0, 0.03, -0.3, -0.45] // Serve per ridimensionare e centrare il disegno del cuore
            });

            confetti({
                shapes: [cuore],
                particleCount: 50,
                spread: 120,
                origin: { y: 0.7 },
                scalar: scalar,
                colors: ['#ff0000', '#ff69b4']
            });
        });
    </script>
</body>
</html>
