<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bottone dell'amooooouuuuuur</title>
    
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 50px;
            padding: 0 20px;
            color: #333;
        }

        /* Area dove i bottoni vivono */
        .area-gioco {
            position: relative;
            width: 100%;
            height: 100px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            position: absolute; /* Entrambi absolute per controllo totale */
            transition: all 0.2s ease;
        }

        #bottoneVero {
            background-color: #28a745;
            color: white;
            /* Posizionato a sinistra del centro */
            left: calc(50% - 110px);
            top: 0;
        }

        #bottoneDispettoso {
            background-color: #dc3545;
            color: white;
            /* Posizionato a destra del centro */
            left: calc(50% + 10px);
            top: 0;
        }
    </style>
</head>
<body>

    <h1>Lo sai che sei il mio amour bello bellissimo? EH!!</h1>
    
    <div class="area-gioco">
        <button id="bottoneVero">SI</button>
        <button id="bottoneDispettoso">NO</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <script>
        const noBtn = document.getElementById('bottoneDispettoso');
        const siBtn = document.getElementById('bottoneVero');

        // FUNZIONE PER FAR SCAPPARE IL BOTTONE
        noBtn.addEventListener('mouseover', () => {
            // Calcoliamo limiti sicuri (non troppo vicini ai bordi)
            const padding = 50;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            // Genera nuove coordinate
            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            // Muovi il bottone in tutto lo schermo
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        });

        // FUNZIONE PER I CUORI
        siBtn.addEventListener('click', () => {
            // Esplosione Coriandoli
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });

            // Esplosione Cuori (Funzionerà grazie alla versione 1.9.3)
            const scalar = 3;
            const cuore = confetti.shapeFromText({ text: '❤️', scalar });

            confetti({
                shapes: [cuore],
                particleCount: 50,
                spread: 120,
                origin: { y: 0.7 },
                scalar: scalar
            });
        });
    </script>
</body>
</html>
